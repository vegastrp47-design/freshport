<!doctype html>
<!-- @dsCard height=300 -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Port · Cover</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--surface); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--surface); }
  .cover svg { position: absolute; inset: 0; }
  .slab   { fill: var(--surface-inverse); rx: var(--radius-panel); }
  .gold   { fill: var(--harbour-gold); rx: var(--radius-card); }
  .pine   { fill: var(--stripe-cherry); }
  .sun    { fill: var(--ink-inverse); }
  .ripple { fill: var(--ink-inverse); }
  .text { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 80px; line-height: .95; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
  .tag { margin: 12px 0 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.4; color: var(--ink-muted); }
</style>
<div class="cover">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!--
      blocks: surface-inverse slab 360x240 (space-xl x9, space-lg x10) bleeding off top/right, rx radius-panel;
              harbour-gold 104x104 (space-section), rx radius-card (the business profile's gold); stripe-cherry pill 208x40 (space-section x2, space-xl), rx half;
              ink-inverse disc r=24 (space-lg) as the logo's sun, white on the navy slab like the primary logo.
      arrangement: one tall slab with satellites, the way the ship mark stacks cargo above the waterline.
      pattern: literal motif, the Ripple Lines under the hull: "always horizontal, rounded ends, 3-5 bars of varying length" (README).
      scales: ripple bars 8px tall (space-xs) at a 20px pitch (space-xs + space-sm), lengths 208/160/104/56 centred like the wake under the hull, rx radius-pill (half = 4).
    -->
    <rect class="slab" x="600" y="-16" width="360" height="240"/>
    <circle class="sun" cx="880" cy="64" r="24"/>
    <rect class="ripple" x="648" y="136" width="208" height="8" rx="4"/>
    <rect class="ripple" x="672" y="156" width="160" height="8" rx="4"/>
    <rect class="ripple" x="700" y="176" width="104" height="8" rx="4"/>
    <rect class="ripple" x="724" y="196" width="56"  height="8" rx="4"/>
    <rect class="gold" x="520" y="168" width="104" height="104"/>
    <rect class="pine" x="648" y="248" width="208" height="40" rx="20"/>
  </svg>
  <div class="text">
    <h1 class="name">Fresh Port</h1>
    <p class="tag">Straight from the port to our shelf.</p>
  </div>
</div>
</body>
</html>
